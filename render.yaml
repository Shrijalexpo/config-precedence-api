services:
  - type: web
    name: config-precedence-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_PORT
        value: "8543"
      - key: APP_LOG_LEVEL
        value: error
      - key: APP_WORKERS
        value: "5"
